<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title desc">
  <title id="title">春を待つミモザ — サンプルのてぬぐい</title>
  <desc id="desc">生成りの布地に芥子色のミモザと細い緑の葉を描いたオリジナルのサンプル柄。</desc>
  <defs>
    <g id="sprig">
      <g fill="none" stroke="#778365" stroke-width="2"><path d="M0 98Q8 39 0-82M4 36-40-18M3 5 42-47M0-38-26-70"/></g>
      <g fill="#7f8b69"><ellipse cx="-7" cy="46" rx="3" ry="21" transform="rotate(-36 -7 46)"/><ellipse cx="14" cy="33" rx="3" ry="22" transform="rotate(26 14 33)"/><ellipse cx="-22" cy="0" rx="3" ry="19" transform="rotate(-50 -22 0)"/><ellipse cx="26" cy="-24" rx="3" ry="17" transform="rotate(43 26 -24)"/><ellipse cx="-13" cy="-52" rx="3" ry="17" transform="rotate(-38 -13 -52)"/></g>
      <g fill="#c7a24f"><circle cx="-42" cy="-19" r="9"/><circle cx="-36" cy="-33" r="8"/><circle cx="-27" cy="-24" r="9"/><circle cx="-48" cy="-40" r="7"/><circle cx="-30" cy="-44" r="8"/><circle cx="-43" cy="-54" r="6"/><circle cx="42" cy="-48" r="9"/><circle cx="34" cy="-62" r="8"/><circle cx="49" cy="-62" r="7"/><circle cx="40" cy="-78" r="7"/><circle cx="56" cy="-43" r="6"/><circle cx="-26" cy="-72" r="8"/><circle cx="-17" cy="-83" r="8"/><circle cx="-32" cy="-85" r="7"/><circle cx="-5" cy="-70" r="8"/><circle cx="-3" cy="-90" r="7"/></g>
      <g fill="#e2c575" opacity=".8"><circle cx="-43" cy="-21" r="3"/><circle cx="-27" cy="-26" r="3"/><circle cx="34" cy="-64" r="3"/><circle cx="42" cy="-50" r="3"/><circle cx="-17" cy="-85" r="3"/></g>
    </g>
    <pattern id="mimosa" width="360" height="320" patternUnits="userSpaceOnUse"><rect width="360" height="320" fill="#f0eadc"/><use href="#sprig" transform="translate(91 145) rotate(-20)"/><use href="#sprig" transform="translate(286 262) rotate(20) scale(.86)"/><use href="#sprig" transform="translate(321 -48) rotate(9) scale(.7)"/><use href="#sprig" transform="translate(-26 274) rotate(-8) scale(.65)"/></pattern>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 1h6M1 0v6" stroke="#fff" stroke-width=".5" opacity=".2"/></pattern>
  </defs>
  <rect width="360" height="960" fill="url(#mimosa)"/><rect width="360" height="960" fill="url(#weave)"/>
  <path d="M4 3h352M4 957h352" stroke="#d9cebb" stroke-width="2" stroke-dasharray="1 3"/>
</svg>
