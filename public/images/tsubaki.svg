<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title desc">
  <title id="title">冬の椿 — サンプルのてぬぐい</title>
  <desc id="desc">生成りの布地に朱色の椿と深い緑の葉を描いたオリジナルのサンプル柄。</desc>
  <defs>
    <g id="flower">
      <g fill="#a8453d">
        <ellipse cy="-20" rx="21" ry="28"/>
        <ellipse cy="-20" rx="21" ry="28" transform="rotate(72)"/>
        <ellipse cy="-20" rx="21" ry="28" transform="rotate(144)"/>
        <ellipse cy="-20" rx="21" ry="28" transform="rotate(216)"/>
        <ellipse cy="-20" rx="21" ry="28" transform="rotate(288)"/>
      </g>
      <g fill="none" stroke="#c77768" stroke-width="1.4" opacity=".8"><path d="M0-42Q-4-23 0-8M-40-15Q-20-13-7-3M-26 34Q-13 22-4 8M24 34Q12 20 3 8M40-14Q20-13 7-3"/></g>
      <circle r="12" fill="#d0a24e"/>
      <g fill="#f2e1a8"><circle cx="-5" cy="-3" r="2"/><circle cx="3" cy="-6" r="2"/><circle cx="5" cy="3" r="2"/><circle cx="-3" cy="5" r="2"/><circle r="2"/></g>
    </g>
    <g id="leaf"><path d="M0 0Q-48-48-66-14Q-47 23 0 0" fill="#5a6652"/><path d="M-4-1-56-12" stroke="#d9d9b9" stroke-width="1" opacity=".65"/></g>
    <pattern id="tsubaki" width="360" height="320" patternUnits="userSpaceOnUse">
      <rect width="360" height="320" fill="#eee8dc"/>
      <g stroke="#6e7057" stroke-width="2.2" fill="none"><path d="M48 269Q101 204 108 92M253 40Q203 118 258 235"/></g>
      <use href="#leaf" transform="translate(92 178) rotate(28)"/><use href="#leaf" transform="translate(101 135) rotate(177) scale(.86)"/>
      <use href="#leaf" transform="translate(230 143) rotate(3) scale(.85)"/><use href="#leaf" transform="translate(247 194) rotate(186)"/>
      <use href="#flower" transform="translate(105 87) rotate(12) scale(.82)"/>
      <use href="#flower" transform="translate(261 246) rotate(-24) scale(.92)"/>
      <use href="#flower" transform="translate(349 64) scale(.62)"/>
      <path d="M78 227q-10-22-22-13q-9 18 10 27" fill="#a8453d"/>
    </pattern>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h5M1 0v5" stroke="#fff" stroke-width=".5" opacity=".16"/></pattern>
  </defs>
  <rect width="360" height="960" fill="url(#tsubaki)"/>
  <rect width="360" height="960" fill="url(#weave)"/>
  <path d="M4 3h352M4 957h352" stroke="#d8cebd" stroke-width="2" stroke-dasharray="1 3"/>
</svg>
